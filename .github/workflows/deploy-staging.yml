name: Deploy to Staging

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  deploy-ingestion:
    name: Deploy ingestion bundle → stg
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Deploy ingestion bundle
        run: databricks bundle deploy --target stg
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy-transformations:
    name: Deploy transformations bundle → stg
    runs-on: ubuntu-latest
    environment: staging
    needs: deploy-ingestion
    defaults:
      run:
        working-directory: transformations
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Deploy transformations bundle
        run: databricks bundle deploy --target stg
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
