resources:
  pipelines:
    transformation2:
      name: transformation2_${bundle.target}
      serverless: true
      channel: CURRENT
      catalog: salesforce_cicd_${bundle.target}_catalog
      schema: event_logs

      configuration:
        catalog: salesforce_cicd_${bundle.target}_catalog
        bronze_schema: ${var.bronze_schema}
        silver_schema: ${var.silver_schema}
        gold_schema: ${var.gold_schema}

      root_path: "./../../src/transformation2"
      libraries:
        - glob:
            include: ./../../src/transformation2/**