resources:
  jobs:
    salesforce_ingestion_job:
      name: salesforce_ingestion_job_${bundle.target}

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: UTC
        pause_status: ${bundle.target == "prod" ? "UNPAUSED" : "PAUSED"}

      tasks:
        - task_key: run_ingestion_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.salesforce_ingestion.id}
